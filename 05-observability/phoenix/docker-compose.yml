# FARCI — Phoenix (observabilité LLM)
#
# Phoenix est un outil d'observabilité pour IA/LLM.
# Il accepte l'ingest OTLP (v3+).

services:
  phoenix:
    image: arizephoenix/phoenix:${PHOENIX_VERSION}
    container_name: farci-phoenix
    restart: unless-stopped
    ports:
      - "${PHOENIX_PORT:?PHOENIX_PORT manquant (config/network.env)}:6006"
    environment:
      PHOENIX_WORKING_DIR: /phoenix
      PHOENIX_SERVER_HTTP_ENDPOINT: http://0.0.0.0:6006
    volumes:
      - phoenix-data:/phoenix
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6006/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  phoenix-data:
