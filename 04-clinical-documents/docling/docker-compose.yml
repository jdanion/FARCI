# FARCI — Docling (FARCI §20)
#
# Docling convertit les PDF en markdown/JSON structuré.
# OCR désactivé par défaut (CPU).

services:
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v${DOCLING_SERVE_VERSION}
    container_name: farci-docling
    restart: unless-stopped
    ports:
      - "${DOCLING_PORT:?DOCLING_PORT manquant (config/network.env)}:5001"
    environment:
      DOCLING_DO_OCR: "false"
      DOCLING_DO_TABLE_STRUCTURE: "true"
      DOCLING_TABLE_STRUCTURE_MODE: "fast"
      DOCLING_USE_V2: "true"
    volumes:
      - docling-cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  docling-cache:
