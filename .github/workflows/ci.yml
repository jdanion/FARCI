# FARCI — CI du dépôt de développement (GitHub). Même commande que sur la
# forge de l'atelier et qu'en local : ./bin/farci ci.
#
# Gitea lit .gitea/workflows/ en priorité : ce fichier n'y est pas exécuté.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dépendances des tests (pydantic, comme requirements.in)
        run: python -m pip install "pydantic==2.13.5"

      - name: ./bin/farci ci
        env:
          NO_COLOR: "1"
        run: ./bin/farci ci
