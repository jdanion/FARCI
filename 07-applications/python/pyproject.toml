[project]
name = "farci-python"
version = "1.0.0"
description = "FARCI — pipeline d'extraction clinique (parcours Python)"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "fpdf2>=2.8.8",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
