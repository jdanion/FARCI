# FARCI — Flowise (FARCI §32)
#
# Flowise est un outil de construction de pipelines LLM par glisser-déposer.

services:
  flowise:
    image: flowiseai/flowise:${FLOWISE_VERSION}
    container_name: farci-flowise
    restart: unless-stopped
    environment:
      FLOWISE_USERNAME: admin
      FLOWISE_PASSWORD: farci-admin
    volumes:
      - flowise-data:/root/.flowise
    ports:
      - "${FLOWISE_PORT:?FLOWISE_PORT manquant (config/network.env)}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  flowise-data:
