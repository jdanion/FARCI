# FARCI — Open WebUI (FARCI §31)
#
# Open WebUI est une interface web pour chat avec les modèles.
# Connexion OBLIGATOIREMENT via Caddy (/v1), pas directement au runtime.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION}
    container_name: farci-open-webui
    restart: unless-stopped
    environment:
      OAI_API_BASE_URL: http://192.168.50.15/v1
      DEFAULT_MODEL: med-extraction
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "true"
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "8080:8080"
    networks:
      farci:
        ipv4_address: ${OPEN_WEBUI_IP}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  open-webui-data:

networks:
  farci:
    external: true
