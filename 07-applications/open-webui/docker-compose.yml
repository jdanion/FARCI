# FARCI — Open WebUI (FARCI §31)
#
# Open WebUI est une interface web pour chat avec les modèles.
# Connexion OBLIGATOIREMENT via Caddy (/v1), pas directement au runtime.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION}
    container_name: farci-open-webui
    restart: unless-stopped
    environment:
      # Point d'entrée stable (Caddy), construit depuis config/network.env.
      OPENAI_API_BASE_URL: ${FARCI_GATEWAY_URL:?FARCI_GATEWAY_URL manquante (REFERENCE_IP, config/network.env)}
      OPENAI_API_KEY: ${GATEWAY_KEY_STANDARD:?GATEWAY_KEY_STANDARD manquant (.env)}
      DEFAULT_MODEL: med-extraction
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "true"
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "${OPEN_WEBUI_PORT:?OPEN_WEBUI_PORT manquant (config/network.env)}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  open-webui-data:
