# FARCI — Ollama (FARCI §15)
#
# Ollama sert les poids GGUF partagés avec llama.cpp.
# Aucun `ollama pull` : les modèles sont importés depuis les fichiers locaux.

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION}
    container_name: farci-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      # Les GGUF préchargés, en lecture seule : 02-inference/ollama/create-model.sh
      # les importe sous le nom logique med-extraction.
      - ${FARCI_MODELS_DIR:?FARCI_MODELS_DIR manquant}:/gguf:ro
      - ollama-data:/root/.ollama
    ports:
      - "${INFERENCE_A_PORT:?INFERENCE_A_PORT manquant (config/network.env)}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama-data:
