# FARCI — configuration LiteLLM (passerelle A, équipe 3)
#
# LiteLLM :
#   1. expose UN nom logique, `med-extraction`, au format OpenAI ;
#   2. masque le runtime : il appelle l'accueil de la salle (/runtime/v1),
#      qui sert le runtime de l'équipe 2 s'il est sain, sinon celui de la
#      référence (runtime rejoué ou modèle de secours) ;
#   3. réessaie, et bascule sur `med-extraction-lite` si le principal échoue.
#
# Aucune adresse ici : FARCI_RUNTIME_URL est transmise par docker-compose.yml,
# construite depuis config/network.env. Ollama, llama.cpp et le runtime
# rejoué parlent tous l'API OpenAI et servent tous `med-extraction` : un seul
# type de fournisseur (openai/) suffit, c'est l'intérêt d'un contrat commun.
#
# Bonus (clés virtuelles, quotas par clé, scénario 03) : LiteLLM exige une
# base PostgreSQL ; voir 03-llm-gateway/TUTORIAL.md.

model_list:
  - model_name: med-extraction
    litellm_params:
      model: openai/med-extraction
      api_base: os.environ/FARCI_RUNTIME_URL
      api_key: farci
      timeout: 300

  - model_name: med-extraction-lite
    litellm_params:
      model: openai/med-extraction-lite
      api_base: os.environ/FARCI_RUNTIME_URL
      api_key: farci
      timeout: 300

  # Scénario 04 : modèle de test volontairement non conforme. Seul le runtime
  # rejoué de la référence le sert : on l'appelle donc directement, sans
  # passer par l'accueil (qui pourrait choisir le runtime de l'équipe).
  - model_name: med-chaos
    litellm_params:
      model: openai/med-chaos
      api_base: os.environ/FARCI_CHAOS_RUNTIME_URL
      api_key: farci

litellm_settings:
  drop_params: true
  num_retries: 1
  request_timeout: 300

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - med-extraction: [med-extraction-lite]
