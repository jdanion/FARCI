# FARCI — Bifrost gateway (option 3B, alternative à LiteLLM)
#
# Bifrost est une gateway OpenAI-compatible écrite en Go.
# Plus léger que LiteLLM, mais moins de fonctionnalités.

services:
  bifrost:
    image: maximhq/bifrost:v${BIFROST_VERSION}
    container_name: farci-bifrost
    restart: unless-stopped
    environment:
      # Adresse du runtime, construite depuis config/network.env (aucune IP ici).
      FARCI_RUNTIME_URL: ${FARCI_RUNTIME_URL:?FARCI_RUNTIME_URL manquante (REFERENCE_IP, config/network.env)}
    volumes:
      - ./config.json:/app/config.json:ro
      - bifrost-data:/data
    ports:
      - "${GATEWAY_B_PORT:?GATEWAY_B_PORT manquant (config/network.env)}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bifrost-data:
