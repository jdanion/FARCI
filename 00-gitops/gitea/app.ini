; FARCI — configuration Gitea (template)
; Les valeurs sensibles sont injectées via variables d'environnement GITEA__*
; Ce fichier est monté en read-only dans le conteneur.

APP_NAME = FARCI Forge
RUN_USER = git
RUN_MODE = prod

[repository]
ROOT = /data/git/repositories
DEFAULT_BRANCH = main

[server]
HTTP_PORT = 3000
SSH_PORT = 22
DISABLE_SSH = false
START_SSH_SERVER = false
LFS_START_SERVER = true

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = true
DEFAULT_KEEP_EMAIL_PRIVATE = true

[security]
INSTALL_LOCK = true
SECRET_KEY = __SECRET_KEY__
INTERNAL_TOKEN = __INTERNAL_TOKEN__

[database]
DB_TYPE = postgres
HOST = postgres:5432
NAME = gitea
USER = gitea
PASSWD = __DB_PASSWORD__

[log]
MODE = console
LEVEL = info
ROOT_PATH = /data/gitea/log
