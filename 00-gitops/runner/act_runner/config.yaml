# FARCI — configuration act_runner (montée dans le conteneur, CONFIG_FILE).
#
# Les labels ne sont PAS ici : ils viennent de GITEA_RUNNER_LABELS
# (00-gitops/docker-compose.yml), qui lit la version de l'image dans
# versions.env. Une liste vide ici laisse act_runner utiliser ceux de
# l'enregistrement.

log:
  level: info

runner:
  file: /data/.runner
  capacity: 2
  labels: []

container:
  # Les jobs (tests d'intégration) doivent joindre les briques par leur
  # adresse sur le réseau de l'atelier.
  network: farci
  privileged: false
  # Air-gap : ne jamais tenter de retélécharger l'image d'un job.
  force_pull: false

cache:
  enabled: false
