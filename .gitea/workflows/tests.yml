# FARCI — CI de chaque Pull Request, sur le runner de l'atelier (Gitea Actions).
#
# Une seule commande, la même qu'en local : ./bin/farci ci
# (selftest, lint, tests unitaires, gold contre gold, gold reproductible).
#
# Air-gap : aucune action externe (pas de `uses:`), donc rien à télécharger
# depuis github.com. Le dépôt est cloné depuis la forge locale avec le jeton
# du job. Le label `farci` est déclaré par le runner (00-gitops) et pointe
# vers une image préchargée (node:${CI_RUNNER_NODE_VERSION}, avec git et python3).

name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Relance à la main (formateur, recette J-1).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: farci
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt (forge locale, sans action externe)
        env:
          TOKEN: ${{ gitea.token }}
          SERVER: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
          SHA: ${{ gitea.sha }}
        run: |
          set -eu
          git init -q .
          git -c http.extraHeader="Authorization: token ${TOKEN}" \
            fetch -q --depth 1 "${SERVER}/${REPO}.git" "${SHA}"
          git checkout -q FETCH_HEAD

      - name: ./bin/farci ci
        env:
          NO_COLOR: "1"
        run: ./bin/farci ci
