# FARCI — Agents Arcane déportés sur chaque brique (Phase 15)
#
# Chaque agent supervise une brique du pipeline et alerte en cas d'anomalie.
# Déploiement orchestré par GitOps (webhook Gitea → gitops.sh).

services:
  agent-ollama:
    build:
      context: ./arcane-agent
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE_TAG: ${PYTHON_IMAGE_TAG:?PYTHON_IMAGE_TAG manquant (versions.env)}
        TARGET_SERVICE: ollama
    container_name: farci-agent-ollama
    restart: unless-stopped
    environment:
      TARGET_SERVICE: ollama
      TARGET_URL: http://${INFERENCE_A_IP:?INFERENCE_A_IP manquant (config/network.env)}:${INFERENCE_PORT:?INFERENCE_PORT manquant}/api/tags
      CHECK_INTERVAL: "30"
      ALERT_WEBHOOK: ${ALERT_WEBHOOK_URL:-}
    networks:
      - farci

  agent-llamacpp:
    build:
      context: ./arcane-agent
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE_TAG: ${PYTHON_IMAGE_TAG:?PYTHON_IMAGE_TAG manquant (versions.env)}
        TARGET_SERVICE: llamacpp
    container_name: farci-agent-llamacpp
    restart: unless-stopped
    environment:
      TARGET_SERVICE: llamacpp
      TARGET_URL: http://${INFERENCE_B_IP:?INFERENCE_B_IP manquant (config/network.env)}:${INFERENCE_PORT:?INFERENCE_PORT manquant}/health
      CHECK_INTERVAL: "30"
      ALERT_WEBHOOK: ${ALERT_WEBHOOK_URL:-}
    networks:
      - farci

  agent-gateway:
    build:
      context: ./arcane-agent
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE_TAG: ${PYTHON_IMAGE_TAG:?PYTHON_IMAGE_TAG manquant (versions.env)}
        TARGET_SERVICE: gateway
    container_name: farci-agent-gateway
    restart: unless-stopped
    environment:
      TARGET_SERVICE: gateway
      TARGET_URL: http://${CADDY_IP:?CADDY_IP manquant (config/network.env)}:${CADDY_INTERNAL_PORT:?CADDY_INTERNAL_PORT manquant}/healthz
      CHECK_INTERVAL: "30"
      ALERT_WEBHOOK: ${ALERT_WEBHOOK_URL:-}
    networks:
      - farci

  agent-docling:
    build:
      context: ./arcane-agent
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE_TAG: ${PYTHON_IMAGE_TAG:?PYTHON_IMAGE_TAG manquant (versions.env)}
        TARGET_SERVICE: docling
    container_name: farci-agent-docling
    restart: unless-stopped
    environment:
      TARGET_SERVICE: docling
      TARGET_URL: http://${DOCLING_IP:?DOCLING_IP manquant (config/network.env)}:${DOCLING_PORT:?DOCLING_PORT manquant}/health
      CHECK_INTERVAL: "30"
      ALERT_WEBHOOK: ${ALERT_WEBHOOK_URL:-}
    networks:
      - farci

  agent-mlflow:
    build:
      context: ./arcane-agent
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE_TAG: ${PYTHON_IMAGE_TAG:?PYTHON_IMAGE_TAG manquant (versions.env)}
        TARGET_SERVICE: mlflow
    container_name: farci-agent-mlflow
    restart: unless-stopped
    environment:
      TARGET_SERVICE: mlflow
      TARGET_URL: http://${MLFLOW_IP:?MLFLOW_IP manquant (config/network.env)}:${MLFLOW_PORT:?MLFLOW_PORT manquant}/health
      CHECK_INTERVAL: "30"
      ALERT_WEBHOOK: ${ALERT_WEBHOOK_URL:-}
    networks:
      - farci

  webhook-receiver:
    build:
      context: ./webhook
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE_TAG: ${PYTHON_IMAGE_TAG:?PYTHON_IMAGE_TAG manquant (versions.env)}
    container_name: farci-webhook-receiver
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET requis}
      GITOPS_SCRIPT: /app/gitops/gitops.sh
    volumes:
      - ./gitops:/app/gitops:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - farci

networks:
  farci:
    external: true
