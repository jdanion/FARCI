# FARCI — configuration agent Arcane

agent:
  name: farci-arcane-agent
  version: "1.0"

# Healthcheck par brique. Aucune adresse ici : chaque agent reçoit son URL
# complète par TARGET_URL (08-arcane-agents/docker-compose.yml), construite
# depuis config/network.env. url_var nomme la variable d'origine.
services:
  ollama:
    url_var: INFERENCE_A_URL
    health_path: /api/tags
    interval: 30
    timeout: 5

  llamacpp:
    url_var: INFERENCE_B_URL
    health_path: /health
    interval: 30
    timeout: 5

  gateway:
    url_var: CADDY_URL
    health_path: /healthz
    interval: 30
    timeout: 5

  docling:
    url_var: DOCLING_URL
    health_path: /health
    interval: 30
    timeout: 5

  mlflow:
    url_var: MLFLOW_URL
    health_path: /health
    interval: 30
    timeout: 5

# Alertes
alerts:
  webhook_url: ${ALERT_WEBHOOK_URL:-}
  on_status: ["down", "error"]
