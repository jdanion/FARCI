# FARCI — registre des services
# =============================================================================
# SOURCE DE VÉRITÉ UNIQUE du dépôt (hors versions et adresses).
#
# Tout ce qui décrit « quels services existent » est ici :
#   - Caddy sait quoi exposer            (phases 1 et 3)
#   - health-aggregator sait quoi exiger  (phase 3)
#   - Uptime Kuma sait quelles sondes créer (phase 3)
#   - le tableau de progression sait quoi afficher (phase 3)
#   - le lint sait quelles adresses sont autorisées
#
# RÈGLES DE FORMAT (ce fichier est lu par scripts/lib/miniyaml.py, pas par un
# parseur YAML complet — aucune dépendance externe en mode air-gap) :
#   - indentation de 2 espaces exactement
#   - une liste est introduite par "- " ; un objet d'une liste par "- cle: valeur"
#   - pas d'ancres, pas d'alias, pas de valeurs multilignes, pas de tabs
#   - pas d'adresse IP ici : uniquement le NOM de la variable (ip_var)
# =============================================================================

meta:
  schema_version: 1
  # Chemin du réseau Docker partagé par toutes les équipes (FARCI §4).
  network_name: farci

groups:
  CORE_INFRASTRUCTURE: Infrastructure cœur
  AI_RUNTIMES: Runtimes d'inférence
  LLM_GATEWAYS: Passerelles LLM
  DOCUMENT_PIPELINE: Traitement documentaire
  OBSERVABILITY: Observabilité
  RESEARCH_PIPELINE: Pipeline de recherche
  CLIENT_APPLICATIONS: Applications clientes

# CLINICAL PIPELINE READY (FARCI §14) — règle unique, calculée par
# scripts/services.py (pipeline_state) pour le tableau ET pour le
# health-aggregator :
#   - tous les services `critical: true` répondent ;
#   - pour chaque `critical_group`, AU MOINS UN service du groupe répond
#     (un runtime suffit : c'est ce qui rend le scénario 01 observable).
#
# `tier` dit à qui revient la brique pendant les 4 h :
#   core   objectif des équipes de l'étape 1 (ou de l'étape 2 pour Open WebUI)
#   bonus  équipe volontaire ou démonstration du formateur ; jamais requis.
# Phoenix est `core` mais pas critique : l'observabilité est hors du chemin
# de production (scénario 07, ARCHITECTURE §7).
#
# `reference_port_var` : la pile de référence du formateur (reference/, sur
# REFERENCE_IP) fournit ce service sur ce port. Quand la brique de l'équipe
# ne répond pas, l'accueil de la salle sert celle de la référence, et le
# tableau l'affiche avec 🛟. Les runtimes de référence sont le runtime rejoué
# (REPLAY_PORT), ou le modèle de secours si le formateur l'a démarré.
services:
  - id: gitea
    label: Gitea
    team: "0"
    compose: 00-gitops
    group: CORE_INFRASTRUCTURE
    ip_var: GITEA_IP
    port_var: GITEA_PORT
    # Chemins essayés dans l'ordre : un même contrat peut s'appeler
    # différemment selon l'implémentation (cf. FARCI §16 et §2).
    health_paths:
      - /api/healthz
      - /healthz
    tier: bonus
    critical: false
    phase: 2

  - id: caddy
    label: Caddy
    team: "1"
    compose: 01-network-dashboard
    group: CORE_INFRASTRUCTURE
    ip_var: CADDY_IP
    port_var: CADDY_PORT
    reference_port_var: ENTRY_PORT
    # /livez répond par Caddy seul ; /healthz est relayé à l'agrégateur.
    health_paths:
      - /livez
    tier: core
    critical: true
    phase: 3

  - id: health-aggregator
    label: Health Aggregator
    team: "1"
    compose: 01-network-dashboard
    group: CORE_INFRASTRUCTURE
    ip_var: HEALTH_AGGREGATOR_IP
    port_var: HEALTH_AGGREGATOR_PORT
    reference_port_var: HEALTH_AGGREGATOR_PORT
    # /livez et non /healthz : l'agrégateur se sonde lui-même, et /healthz
    # relancerait l'agrégation en boucle.
    health_paths:
      - /livez
    tier: core
    critical: true
    phase: 3

  - id: inference-ollama
    label: Inference A (Ollama)
    team: "2"
    compose: 02-inference
    group: AI_RUNTIMES
    ip_var: INFERENCE_A_IP
    port_var: INFERENCE_A_PORT
    reference_port_var: REPLAY_PORT
    health_paths:
      - /v1/models
      - /api/tags
    tier: core
    critical_group: runtime
    critical: false
    phase: 4

  - id: inference-llamacpp
    label: Inference B (llama.cpp)
    team: "2"
    compose: 02-inference
    group: AI_RUNTIMES
    ip_var: INFERENCE_B_IP
    port_var: INFERENCE_B_PORT
    reference_port_var: REPLAY_PORT
    health_paths:
      - /v1/models
      - /health
    # Cœur comme Ollama : c'est le runtime des postes sans grosse
    # configuration (Ollama + modèle 9B exigent un GPU ou 32 Go de RAM).
    tier: core
    critical_group: runtime
    critical: false
    phase: 4

  # Hors atelier : ni proposé au casting, ni préchargé, ni sur le tableau
  # (deux options par brique). Reste joignable si un Mac le sert.
  - id: inference-omlx
    label: Inference C (oMLX / Mac)
    team: "2"
    compose: 02-inference
    group: AI_RUNTIMES
    ip_var: INFERENCE_C_IP
    port_var: INFERENCE_C_PORT
    reference_port_var: REPLAY_PORT
    health_paths:
      - /v1/models
      - /health
    tier: bonus
    critical_group: runtime
    critical: false
    phase: 4

  - id: gateway-litellm
    label: Gateway A (LiteLLM)
    team: "3"
    compose: 03-llm-gateway
    group: LLM_GATEWAYS
    ip_var: GATEWAY_A_IP
    port_var: GATEWAY_A_PORT
    reference_port_var: GATEWAY_A_PORT
    health_paths:
      - /health/liveliness
      - /health
    # Une passerelle suffit : LiteLLM OU Bifrost (l'équipe choisit sa stack).
    tier: core
    critical_group: passerelle
    critical: false
    phase: 5

  - id: gateway-bifrost
    label: Gateway B (Bifrost)
    team: "3"
    compose: 03-llm-gateway
    group: LLM_GATEWAYS
    ip_var: GATEWAY_B_IP
    port_var: GATEWAY_B_PORT
    health_paths:
      - /health
      - /api/health
    tier: core
    critical_group: passerelle
    critical: false
    phase: 5

  - id: docling
    label: Docling
    team: "4"
    compose: 04-clinical-documents
    group: DOCUMENT_PIPELINE
    ip_var: DOCLING_IP
    port_var: DOCLING_PORT
    reference_port_var: DOCLING_PORT
    health_paths:
      - /health
      - /v1/health
    tier: core
    critical: true
    phase: 6

  # EDS-NLP (AP-HP) : pseudonymisation EDS-Pseudo + entités par LLM. Cœur
  # pour l'équipe 4, doublé par le Pi, mais HORS de READY : sa panne ne doit
  # jamais arrêter l'extraction principale.
  - id: eds-nlp
    label: EDS-NLP
    team: "4"
    compose: 04-clinical-documents/eds-nlp
    group: DOCUMENT_PIPELINE
    ip_var: EDS_NLP_IP
    port_var: EDS_NLP_PORT
    reference_port_var: EDS_NLP_PORT
    health_paths:
      - /health
    tier: core
    critical: false
    phase: 6

  - id: phoenix
    label: Observability A (Phoenix)
    team: "5"
    compose: 05-observability
    group: OBSERVABILITY
    ip_var: OBSERVABILITY_A_IP
    port_var: PHOENIX_PORT
    reference_port_var: PHOENIX_PORT
    health_paths:
      - /healthz
      - /
    tier: core
    critical: false
    phase: 7

  - id: langfuse
    label: Observability B (Langfuse)
    team: "5"
    compose: 05-observability
    group: OBSERVABILITY
    ip_var: OBSERVABILITY_B_IP
    port_var: LANGFUSE_PORT
    health_paths:
      - /api/public/health
      - /health
    # Alternative à Phoenix : la ligne Observability passe au vert avec l'une
    # ou l'autre (hors CLINICAL PIPELINE READY, comme Phoenix).
    tier: core
    critical: false
    phase: 7

  - id: mlflow
    label: MLflow
    team: "6"
    compose: 06-evaluation
    group: RESEARCH_PIPELINE
    ip_var: MLFLOW_IP
    port_var: MLFLOW_PORT
    health_paths:
      - /health
      - /version
    tier: bonus
    critical: false
    phase: 8

  - id: uptime-kuma
    label: Uptime Kuma
    team: "1"
    compose: 01-network-dashboard
    group: CORE_INFRASTRUCTURE
    ip_var: UPTIME_KUMA_IP
    port_var: UPTIME_KUMA_PORT
    health_paths:
      - /api/status-page/heartbeat/1
    tier: bonus
    critical: false
    phase: 3

  - id: open-webui
    label: Open WebUI
    team: "7"
    compose: 07-applications
    group: CLIENT_APPLICATIONS
    ip_var: OPEN_WEBUI_IP
    port_var: OPEN_WEBUI_PORT
    reference_port_var: OPEN_WEBUI_PORT
    health_paths:
      - /health
    tier: core
    critical: false
    phase: 9

  # Démonstration du formateur, pas une option étudiante : hors tableau.
  - id: flowise
    label: Flowise
    team: "7"
    compose: 07-applications
    group: CLIENT_APPLICATIONS
    ip_var: FLOWISE_IP
    port_var: FLOWISE_PORT
    health_paths:
      - /health
    tier: bonus
    critical: false
    phase: 9

# Routes de l'ACCUEIL DE LA SALLE (Caddy du Pi, et celui de l'équipe 1).
# Pour chaque route : les services d'équipe essayés dans l'ordre, puis le
# service de la référence (son `reference_port_var` sur REFERENCE_IP).
# `./bin/farci rescue <route>` retire les services d'équipe : la référence
# sert seule. scripts/services.py (commande upstreams) construit les listes,
# 01-network-dashboard/caddy/Caddyfile les lit (variables UP_*).
routes:
  - name: passerelle
    var: UP_PASSERELLE
    services: [gateway-litellm, gateway-bifrost]
    reference: gateway-litellm
  - name: inference
    var: UP_INFERENCE
    services: [inference-ollama, inference-llamacpp, inference-omlx]
    reference: inference-ollama
  - name: documents
    var: UP_DOCUMENTS
    services: [docling]
    reference: docling
  - name: observabilite
    var: UP_OBSERVABILITE
    services: [phoenix]
    reference: phoenix
  - name: eds
    var: UP_EDS
    services: [eds-nlp]
    reference: eds-nlp

# Lignes du tableau de progression projeté dans l'amphithéâtre (FARCI §49).
# Les lignes `core` sont toujours affichées ; les lignes `bonus` sont résumées
# en une seule ligne (sauf ./bin/farci status --all). Au-delà d'une dizaine
# de lignes, personne ne lit depuis le fond de la salle.
status_rows:
  - label: Network
    tier: core
    check: [caddy, health-aggregator]
  # une_parmi : la ligne est verte dès qu'UNE de ses briques est livrée
  # (l'équipe choisit sa stack selon son poste).
  - label: Inference
    tier: core
    une_parmi: true
    check: [inference-ollama, inference-llamacpp]
  - label: LLM Gateway
    tier: core
    une_parmi: true
    check: [gateway-litellm, gateway-bifrost]
  - label: Documents
    tier: core
    check: [docling]
  - label: EDS-NLP
    tier: core
    check: [eds-nlp]
  - label: Observability
    tier: core
    une_parmi: true
    check: [phoenix, langfuse]
  - label: Open WebUI
    tier: core
    check: [open-webui]
  - label: GitOps
    tier: bonus
    check: [gitea]
  - label: MLflow
    tier: bonus
    check: [mlflow]
  - label: Uptime Kuma
    tier: bonus
    check: [uptime-kuma]
