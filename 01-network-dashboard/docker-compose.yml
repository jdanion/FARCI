# FARCI — Réseau, Caddy, dashboard, health-aggregator (FARCI §4, §12-§14)

services:
  caddy:
    image: caddy:${CADDY_VERSION}
    container_name: farci-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      farci:
        ipv4_address: ${CADDY_IP}
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 10s
      timeout: 5s
      retries: 3

  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_VERSION}
    container_name: farci-uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      farci:
        ipv4_address: ${UPTIME_KUMA_IP}
    healthcheck:
      test: ["CMD", "node", "extra/check-http.js", "http://localhost:3001"]
      interval: 10s
      timeout: 5s
      retries: 3

  health-aggregator:
    image: python:${PYTHON_IMAGE_TAG}
    container_name: farci-health-aggregator
    restart: unless-stopped
    working_dir: /app
    command: python app.py
    volumes:
      - ./health-aggregator:/app:ro
      - ../../config/services.yaml:/app/config/services.yaml:ro
    ports:
      - "8081:8081"
    networks:
      farci:
        ipv4_address: ${HEALTH_AGGREGATOR_IP}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  caddy-data:
  caddy-config:
  uptime-kuma-data:

networks:
  farci:
    external: true
